name: Build Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('examples/espnow_chat_test/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build Master & Slave (espnow_chat_test)
        working-directory: examples/espnow_chat_test
        run: |
          pio run -e master
          pio run -e slave
