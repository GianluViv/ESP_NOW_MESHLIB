; Progetto di test ESPNowMesh — Sistema di messaggistica via Serial
;
; Compila e carica sulle due schede ESP32 con:
;   pio run -e master -t upload
;   pio run -e slave  -t upload
;
; Apri due terminali seriali per chattare:
;   pio device monitor -p /dev/ttyUSB0
;   pio device monitor -p /dev/ttyUSB1

[env]
; Usa la piattaforma espressif32 installata in PlatformIO.
; Se preferisci pioarduino (Arduino Core 3.x), sostituisci la riga sotto con:
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../..

[env:master]
build_flags = -DIS_MASTER=1

[env:slave]
build_flags = -DIS_MASTER=0
